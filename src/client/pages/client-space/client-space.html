<!-- Restricted area (Client role) -->
<div x-show="false" x-cloak class="mx-auto flex max-w-md flex-col items-center gap-3 py-24 text-center">
  <span class="grid size-12 place-items-center rounded-full bg-muted"><svg class="i size-5 text-muted-foreground"><use href="#i-lock"/></svg></span>
  <h1 class="text-lg font-semibold">Restricted area</h1>
  <p class="text-sm text-muted-foreground">Client accounts only have access to the Client Space. Switch roles from the profile menu to explore internal views.</p>
  <a href="client-space.html" class="btn btn-primary">Go to Client Space</a>
</div>

<!-- ================= CLIENT SPACE ================= -->
<div class="mx-auto max-w-6xl">

  <div class="mb-6 flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
    <div class="min-w-0">
      <p class="mb-1 font-mono text-xs tracking-wide text-muted-foreground uppercase" x-text="clientUser?.company ?? 'Client'"></p>
      <h1 class="text-2xl font-semibold tracking-tight text-balance">Client Space</h1>
      <p class="mt-1 max-w-2xl text-sm text-muted-foreground text-pretty" x-text="pageDescription"></p>
    </div>
  </div>

  <div x-show="clientProjects.length === 0" x-cloak class="rounded-lg border border-dashed bg-card/50 px-6 py-12 text-center">
    <p class="text-sm font-medium">No shared projects</p>
  </div>

  <div x-show="clientProjects.length > 0" class="flex flex-col gap-2">

    <!-- One tab per project -->
    <div x-show="clientProjects.length > 1" role="tablist" class="mb-2 inline-flex h-8 w-fit items-center justify-center rounded-lg bg-muted p-[3px] text-muted-foreground">
      <template x-for="p in clientProjects" :key="p.id">
        <button type="button" role="tab" :aria-selected="selected === p.id" @click="selected = p.id"
                class="relative inline-flex h-[calc(100%-1px)] flex-1 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-transparent px-3 py-0.5 text-sm font-medium whitespace-nowrap transition-all outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50"
                :class="selected === p.id ? 'bg-background text-foreground shadow-sm' : 'text-foreground/60 hover:text-foreground'" x-text="p.name"></button>
      </template>
    </div>

    <template x-if="cp">
      <div class="flex flex-col gap-6">

        <!-- Progress -->
        <div class="card gap-5 p-6">
          <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
            <div>
              <p class="font-mono text-xs text-muted-foreground" x-text="cp.code"></p>
              <h2 class="mt-1 text-xl font-semibold" x-text="cp.name"></h2>
              <p class="mt-1 max-w-xl text-sm text-pretty text-muted-foreground" x-text="cp.description"></p>
            </div>
            <span class="badge badge-outline gap-1.5 font-medium" :class="TONES[PROJECT_TONE[cp.status]]">
              <span aria-hidden="true" class="size-1.5 rounded-full bg-current"></span><span x-text="cp.status"></span>
            </span>
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex items-baseline justify-between">
              <span class="text-sm text-muted-foreground">Overall progress</span>
              <span class="font-mono text-2xl font-semibold" x-text="cpProgress + '%'"></span>
            </div>
            <div role="progressbar" :aria-valuenow="cpProgress" aria-valuemin="0" aria-valuemax="100" class="h-2.5 w-full overflow-hidden rounded-full bg-muted">
              <div class="h-full rounded-full transition-all" :class="cpProgress === 100 ? 'bg-success' : 'bg-primary'" :style="`width: ${cpProgress}%`"></div>
            </div>
            <div class="flex justify-between text-xs text-muted-foreground">
              <span x-text="'Started ' + fd(cp.startDate, 'D MMM YYYY')"></span>
              <span x-text="'Target ' + fd(cp.endDate, 'D MMM YYYY')"></span>
            </div>
          </div>
        </div>

        <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_320px]">
          <div class="flex min-w-0 flex-col gap-6">

            <!-- Milestones -->
            <div class="card gap-4 p-5">
              <h3 class="font-semibold">Key milestones</h3>
              <p x-show="cpMilestones.length === 0" class="text-sm text-muted-foreground">No milestones shared yet.</p>
              <ol x-show="cpMilestones.length > 0" class="relative flex flex-col gap-5 border-l-2 border-border pl-6">
                <template x-for="m in cpMilestones" :key="m.id">
                  <li class="relative">
                    <span class="absolute top-0.5 -left-[33px] bg-card">
                      <svg x-show="m.done" class="i size-4 text-success"><use href="#i-circle-check"/></svg>
                      <svg x-show="!m.done" class="i size-4 text-muted-foreground"><use href="#i-circle"/></svg>
                    </span>
                    <p class="text-sm font-medium" :class="m.done ? 'text-muted-foreground line-through decoration-1' : ''" x-text="m.title"></p>
                    <p class="text-xs text-muted-foreground" x-text="moment(m.date).format('ddd D MMMM YYYY')"></p>
                  </li>
                </template>
              </ol>
            </div>

            <!-- Meetings (read-only) -->
            <section aria-labelledby="client-meetings" class="flex flex-col gap-3">
              <h3 id="client-meetings" class="font-semibold">Meetings</h3>
              <div class="flex flex-col gap-6">
                <section class="flex flex-col gap-3">
                  <h4 class="text-sm font-semibold">Upcoming</h4>
                  <p x-show="upcoming.length === 0" class="text-sm text-muted-foreground">No meetings scheduled.</p>
                  <div class="grid gap-3 md:grid-cols-2">
                    <template x-for="m in upcoming" :key="m.id">
                      <div class="card flex-row gap-4 p-4">
                  <div class="flex w-14 shrink-0 flex-col items-center justify-center rounded-lg bg-primary/8 py-2 text-primary">
                    <span class="text-[11px] font-medium uppercase" x-text="moment(m.start).format('MMM')"></span>
                    <span class="text-xl leading-none font-semibold tabular-nums" x-text="moment(m.start).format('D')"></span>
                    <span class="mt-0.5 text-[10px] text-muted-foreground" x-text="moment(m.start).format('ddd')"></span>
                  </div>
                  <div class="flex min-w-0 flex-1 flex-col gap-1.5">
                    <p class="truncate font-medium" x-text="m.title"></p>
                    <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-muted-foreground">
                      <span class="inline-flex items-center gap-1"><svg class="i size-3"><use href="#i-clock"/></svg><span x-text="ft(m.start) + ' · ' + m.durationMin + ' min'"></span></span>
                      <span class="inline-flex min-w-0 items-center gap-1"><svg class="i size-3"><use :href="isOnline(m) ? '#i-video' : '#i-map-pin'"/></svg><span class="truncate" x-text="m.location"></span></span>
                    </div>
                    <div class="flex -space-x-1.5">
                      <template x-for="a in stack(m.attendeeIds)" :key="a.id">
                        <span class="inline-flex rounded-full" :title="a.name + ' · ' + a.title">
                          <span class="relative flex size-6 shrink-0 rounded-full ring-2 ring-card select-none"><span class="flex size-full items-center justify-center rounded-full text-[10px] font-semibold" :class="color(a.id)" x-text="a.initials"></span></span>
                        </span>
                      </template>
                      <span x-show="rest(m.attendeeIds) > 0" class="relative flex size-6 shrink-0 items-center justify-center rounded-full bg-muted text-[10px] text-muted-foreground ring-2 ring-background" x-text="'+' + rest(m.attendeeIds)"></span>
                    </div>
                  </div>
                </div>
                    </template>
                  </div>
                </section>
                <section x-show="past.length > 0" x-cloak class="flex flex-col gap-3">
                  <h4 class="text-sm font-semibold text-muted-foreground">Past meetings</h4>
                  <div class="grid gap-3 md:grid-cols-2">
                    <template x-for="m in past" :key="m.id">
                      <div class="card flex-row gap-4 p-4 opacity-70">
                  <div class="flex w-14 shrink-0 flex-col items-center justify-center rounded-lg bg-primary/8 py-2 text-primary">
                    <span class="text-[11px] font-medium uppercase" x-text="moment(m.start).format('MMM')"></span>
                    <span class="text-xl leading-none font-semibold tabular-nums" x-text="moment(m.start).format('D')"></span>
                    <span class="mt-0.5 text-[10px] text-muted-foreground" x-text="moment(m.start).format('ddd')"></span>
                  </div>
                  <div class="flex min-w-0 flex-1 flex-col gap-1.5">
                    <p class="truncate font-medium" x-text="m.title"></p>
                    <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-muted-foreground">
                      <span class="inline-flex items-center gap-1"><svg class="i size-3"><use href="#i-clock"/></svg><span x-text="ft(m.start) + ' · ' + m.durationMin + ' min'"></span></span>
                      <span class="inline-flex min-w-0 items-center gap-1"><svg class="i size-3"><use :href="isOnline(m) ? '#i-video' : '#i-map-pin'"/></svg><span class="truncate" x-text="m.location"></span></span>
                    </div>
                    <div class="flex -space-x-1.5">
                      <template x-for="a in stack(m.attendeeIds)" :key="a.id">
                        <span class="inline-flex rounded-full" :title="a.name + ' · ' + a.title">
                          <span class="relative flex size-6 shrink-0 rounded-full ring-2 ring-card select-none"><span class="flex size-full items-center justify-center rounded-full text-[10px] font-semibold" :class="color(a.id)" x-text="a.initials"></span></span>
                        </span>
                      </template>
                      <span x-show="rest(m.attendeeIds) > 0" class="relative flex size-6 shrink-0 items-center justify-center rounded-full bg-muted text-[10px] text-muted-foreground ring-2 ring-background" x-text="'+' + rest(m.attendeeIds)"></span>
                    </div>
                  </div>
                </div>
                    </template>
                  </div>
                </section>
              </div>
            </section>

            <!-- Messages -->
            <section aria-labelledby="client-messages" class="flex flex-col gap-3">
              <h3 id="client-messages" class="font-semibold">Messages</h3>
              <div class="flex min-w-0 flex-col gap-4">
                <div class="card gap-3 p-4">
                  <label for="new-note" class="text-sm font-medium">Leave a message for the project team</label>
                  <textarea id="new-note" rows="3" x-model="draft" @keydown.enter="($event.metaKey || $event.ctrlKey) && !$event.isComposing && post()"
                            placeholder="Questions, site access updates, feedback..." class="textarea"></textarea>
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="hidden text-xs text-muted-foreground sm:inline">⌘ + Enter to post</span>
                    <button type="button" class="btn btn-primary ml-auto" @click="post()" :disabled="!draft.trim()">
                      <svg class="i"><use href="#i-send"/></svg>
                      Post note
                    </button>
                  </div>
                </div>

                <ol class="flex flex-col gap-3">
                  <template x-for="n in cpNotes" :key="n.id">
                    <li>
                      <div class="card gap-3 p-4">
                        <div class="flex items-start gap-3">
                          <span class="relative flex size-8 shrink-0 rounded-full select-none"><span class="flex size-full items-center justify-center rounded-full text-[10px] font-semibold" :class="color(n.authorId)" x-text="getMember(n.authorId)?.initials"></span></span>
                          <div class="min-w-0 flex-1">
                            <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
                              <span class="text-sm font-medium" x-text="getMember(n.authorId)?.name"></span>
                              <span x-show="getMember(n.authorId)?.role === 'Client'" class="text-xs text-muted-foreground" x-text="'(' + getMember(n.authorId)?.company + ')'"></span>
                              <span class="rounded bg-chart-5/14 px-1.5 py-0.5 text-[11px] font-medium text-chart-5-ink" x-text="n.category"></span>
                              <time class="text-xs text-muted-foreground" :datetime="n.createdAt" x-text="fdt(n.createdAt)"></time>
                            </div>
                          </div>
                          <div x-show="canEditNote(n) && editing.id !== n.id" class="flex gap-0.5">
                            <button type="button" aria-label="Edit note" @click="startEdit(n)" class="grid size-7 cursor-pointer place-items-center rounded-md hover:bg-muted focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"><svg class="i size-4"><use href="#i-pencil"/></svg></button>
                            <button type="button" aria-label="Delete note" @click="remove(n)" class="grid size-7 cursor-pointer place-items-center rounded-md hover:bg-muted focus-visible:ring-2 focus-visible:ring-ring focus-visible:outline-none"><svg class="i size-4"><use href="#i-trash-2"/></svg></button>
                          </div>
                        </div>

                        <div x-show="editing.id === n.id" x-cloak class="flex flex-col gap-2 pl-11">
                          <textarea aria-label="Edit note content" rows="3" x-model="editing.content" class="textarea"></textarea>
                          <div class="flex justify-end gap-2">
                            <button type="button" class="btn btn-outline btn-sm" @click="editing = { id: null, content: '' }">Cancel</button>
                            <button type="button" class="btn btn-primary btn-sm" :disabled="!editing.content.trim()" @click="saveEdit()">Save</button>
                          </div>
                        </div>
                        <p x-show="editing.id !== n.id" class="pl-11 text-sm leading-relaxed text-pretty" x-text="n.content"></p>

                        <div class="pl-11">
                          <button type="button" @click="toggleComments(n)" :aria-expanded="!!openComments[n.id]" class="btn btn-text btn-sm -ml-2 h-6 gap-1 px-2 text-xs text-muted-foreground">
                            <svg class="i"><use href="#i-message-square"/></svg>
                            <span x-text="(n.comments || []).length > 0 ? (n.comments.length + ' comment' + (n.comments.length > 1 ? 's' : '')) : 'Comment'"></span>
                          </button>
                          <div x-show="openComments[n.id]" x-cloak class="mt-2 flex flex-col gap-3 border-l-2 pl-4">
                            <template x-for="c in (n.comments || [])" :key="c.id">
                              <div class="flex gap-2.5">
                                <span class="relative flex size-6 shrink-0 rounded-full select-none"><span class="flex size-full items-center justify-center rounded-full text-[10px] font-semibold" :class="color(c.authorId)" x-text="getMember(c.authorId)?.initials"></span></span>
                                <div class="min-w-0">
                                  <p class="text-xs"><span class="font-medium" x-text="getMember(c.authorId)?.name"></span> <span class="text-muted-foreground" x-text="fdt(c.createdAt)"></span></p>
                                  <p class="text-sm" x-text="c.content"></p>
                                </div>
                              </div>
                            </template>
                            <div x-show="canComment(n)" class="flex items-start gap-2">
                              <textarea aria-label="Write a comment" rows="1" x-model="drafts[n.id]"
                                        @keydown.enter="if (!$event.shiftKey && !$event.isComposing) { $event.preventDefault(); postComment(n) }"
                                        placeholder="Write a comment..." class="textarea min-h-8 py-1.5"></textarea>
                              <button type="button" class="btn btn-primary btn-square shrink-0" aria-label="Post comment" @click="postComment(n)" :disabled="!(drafts[n.id] || '').trim()"><svg class="i"><use href="#i-send"/></svg></button>
                            </div>
                          </div>
                        </div>
                      </div>
                    </li>
                  </template>
                </ol>
                <p x-show="cpNotes.length === 0" class="py-8 text-center text-sm text-muted-foreground">No notes yet.</p>
              </div>
            </section>
          </div>

          <aside class="flex flex-col gap-6">
            <!-- Contacts -->
            <div class="card gap-0 p-0">
              <h3 class="border-b px-4 py-3 font-semibold">Your contacts</h3>
              <ul class="divide-y">
                <template x-for="m in cpContacts" :key="m.id">
                  <li class="flex items-center gap-3 px-4 py-3">
                    <span class="relative flex size-8 shrink-0 rounded-full select-none"><span class="flex size-full items-center justify-center rounded-full text-[10px] font-semibold" :class="color(m.id)" x-text="m.initials"></span></span>
                    <div class="min-w-0">
                      <p class="truncate text-sm font-medium" x-text="m.name"></p>
                      <p class="truncate text-xs text-muted-foreground" x-text="m.title"></p>
                    </div>
                  </li>
                </template>
              </ul>
            </div>

            <!-- Amendments -->
            <div class="card gap-0 p-0">
              <h3 class="border-b px-4 py-3 font-semibold">Contract amendments</h3>
              <p x-show="cpAmendments.length === 0" class="px-4 py-6 text-sm text-muted-foreground">No amendments.</p>
              <ul x-show="cpAmendments.length > 0" class="divide-y">
                <template x-for="a in cpAmendments" :key="a.id">
                  <li class="flex flex-col gap-1.5 px-4 py-3">
                    <div class="flex items-center gap-2">
                      <svg class="i size-4 shrink-0 text-muted-foreground"><use href="#i-file-text"/></svg>
                      <span class="font-mono text-xs" x-text="a.ref"></span>
                      <span class="ml-auto">
                        <span class="badge badge-outline gap-1.5 font-medium" :class="TONES[AMENDMENT_TONE[a.status]]"><span aria-hidden="true" class="size-1.5 rounded-full bg-current"></span><span x-text="a.status"></span></span>
                      </span>
                    </div>
                    <p class="text-sm font-medium" x-text="a.title"></p>
                    <p class="text-xs text-muted-foreground" x-text="(a.amount ? '+' + eur(a.amount) : 'No budget impact') + (a.daysImpact ? ' · +' + a.daysImpact + ' days' : '')"></p>
                  </li>
                </template>
              </ul>
            </div>
          </aside>
        </div>
      </div>
    </template>
  </div>
</div>
