"0" step="1000" x-model="s.ws.threshold" class="input"></div></div><div class="flex gap-x-6 gap-y-2 px-5 py-4 flex-col sm:flex-row sm:items-center sm:justify-between"><div class="min-w-0 sm:max-w-md"><label  class="text-sm font-medium">Clients can comment on notes</label><p class="mt-0.5 text-xs text-muted-foreground">Show the comment box to client accounts in the Client Space.</p></div><div class="shrink-0 sm:w-64"><button type="button" role="switch" :aria-checked="!!(s.ws.clientsComment)" aria-label="Clients can comment" @click="s.ws.clientsComment = !s.ws.clientsComment" class="relative inline-flex h-5 w-9 shrink-0 cursor-pointer items-center rounded-full border border-transparent outline-none transition-colors focus-visible:ring-3 focus-visible:ring-ring/50" :class="s.ws.clientsComment ? 'bg-primary' : 'bg-muted-foreground/35'"><span aria-hidden="true" class="pointer-events-none block size-4 rounded-full bg-white shadow-sm transition-transform" :class="s.ws.clientsComment ? 'translate-x-[18px]' : 'translate-x-0.5'"></span></button></div></div><div class="flex flex-wrap items-center gap-3 bg-muted/40 px-5 py-3"><button type="button" class="btn btn-primary" @click="flashSaved()">Save changes</button><span aria-live="polite" class="inline-flex items-center gap-1 text-sm text-success-ink transition-opacity" :class="saved ? 'opacity-100' : 'opacity-0'"><svg class="i size-4"><use href="#i-check"/></svg> Saved</span><span class="ml-auto text-xs text-muted-foreground">Preview — not stored.</span></div></div></div>
<div class="card gap-0 p-0"><div class="border-b px-5 py-4"><h2 class="font-semibold">Organisation</h2><p class="mt-0.5 text-sm text-muted-foreground">Reporting lines drive who can see and approve what.</p></div><div class="flex flex-col divide-y"><div class="flex items-center gap-3 px-5 py-4"><span class="grid size-9 place-items-center rounded-md bg-muted text-muted-foreground"><svg class="i size-4"><use href="#i-users"/></svg></span><p class="flex-1 text-sm">Edit who reports to whom.</p><a href="organisation.html" class="btn btn-outline">Open Organisation</a></div></div></div>
<div class="card gap-0 p-0"><div class="border-b px-5 py-4"><h2 class="font-semibold">Data</h2><p class="mt-0.5 text-sm text-muted-foreground">Download a copy of the workspace data.</p></div><div class="flex flex-col divide-y"><div class="flex items-center gap-3 px-5 py-4"><p class="flex-1 text-sm text-muted-foreground">Members, projects, tasks, tests, amendments, meetings and notes as JSON.</p><button type="button" class="btn btn-primary" @click="exportData()"><svg class="i"><use href="#i-download"/></svg>Export data</button></div></div></div>
</div></div></template>
              <template x-if="current === 'permissions'"><div><div class="card gap-0 p-0"><div class="border-b px-5 py-4"><h2 class="font-semibold">Roles &amp; permissions</h2><p class="mt-0.5 text-sm text-muted-foreground">A supervisor inherits at least the rights of everyone below them.</p></div><div class="flex flex-col divide-y"><div class="overflow-x-auto"><table class="w-full caption-bottom text-sm min-w-[760px]">
<thead class="[&_tr]:border-b"><tr class="border-b bg-muted/40 transition-colors hover:bg-muted/40"><th class="h-10 px-5 text-left align-middle font-medium whitespace-nowrap text-foreground">Capability</th><template x-for="c in PERM_COLS" :key="c"><th class="h-10 px-2 text-left align-middle font-medium whitespace-nowrap text-foreground" x-text="c"></th></template></tr></thead>
<tbody class="[&_tr:last-child]:border-0"><template x-for="r in PERM_ROWS" :key="r[0]"><tr class="border-b transition-colors hover:bg-muted/50"><td class="p-2 px-5 align-middle font-medium whitespace-nowrap" x-text="r[0]"></td><template x-for="(c, i) in r.slice(1)" :key="i"><td class="p-2 align-middle text-sm whitespace-nowrap" :class="c === '—' ? 'text-muted-foreground' : ''" x-text="c"></td></template></tr></template></tbody>
</table></div><p class="px-5 py-3 text-xs text-muted-foreground">Read-only overview of the rules applied in the app. Being placed above a manager (directly or not) gives manager rights.</p></div></div></div></template>
              <template x-if="current === 'activity'"><div><div class="card gap-0 p-0"><div class="border-b px-5 py-4"><h2 class="font-semibold">Activity log</h2><p class="mt-0.5 text-sm text-muted-foreground">Recent changes across the workspace.</p></div><div class="flex flex-col divide-y"><div class="flex items-center gap-3 bg-muted/40 px-5 py-3"><label for="al-type" class="text-sm font-medium">Show</label>
<select id="al-type" x-model="s.logType" class="select w-48"><option>All</option><option>Tasks</option><option>Tests</option><option>Amendments</option><option>Meetings</option><option>Access</option></select>
<span class="ml-auto text-xs text-muted-foreground" x-text="logRows.length + ' events'"></span></div>
<template x-for="l in logRows" :key="l.id">
<div class="flex items-center gap-3 px-5 py-3">
  <span class="relative flex size-6 shrink-0 rounded-full select-none"><span class="flex size-full items-center justify-center rounded-full text-[10px] font-semibold" :class="color(l.who)" x-text="getMember(l.who)?.initials"></span></span>
  <p class="min-w-0 flex-1 text-sm"><span class="font-medium" x-text="getMember(l.who)?.name"></span> <span x-text="l.what"></span><span x-show="l.code" class="ml-1.5 font-mono text-[11px] text-muted-foreground" x-text="l.code"></span></p>
  <span class="badge badge-secondary hidden sm:inline-flex" x-text="l.type"></span>
  <span class="w-28 shrink-0 text-right text-xs text-muted-foreground" x-text="l.when"></span>
</div></template><p class="px-5 py-3 text-xs text-muted-foreground">Organisation changes you make are added here; the other events are samples for the prototype.</p></div></div></div></template>
            </div>
          </div>
        </div>
