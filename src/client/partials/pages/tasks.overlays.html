  <!-- ============ Menu flottant « Move to » ============ -->
  <div x-show="menu.open" x-cloak @click.outside="menu.open = false" role="menu"
       :style="`position: fixed; top: ${menu.y}px; left: ${menu.x}px`"
       class="z-50 w-44 rounded-lg bg-popover p-1 text-popover-foreground shadow-md ring-1 ring-foreground/10">
    <button x-show="menu.edit" type="button" role="menuitem" @click="openEdit(menuTask)" class="menu-item">
      <svg class="i size-4"><use href="#i-pencil"/></svg>
      Edit task
    </button>
    <div class="px-1.5 py-1 text-xs font-medium text-muted-foreground">Move to</div>
    <template x-for="s in STATUSES" :key="s">
      <button type="button" role="menuitemradio" :aria-checked="menuTask && menuTask.status === s"
              @click="setStatus(menu.taskId, s); menu.open = false" class="menu-item relative py-1 pr-8">
        <span x-text="s"></span>
        <svg x-show="menuTask && menuTask.status === s" class="i absolute right-2 size-4"><use href="#i-check"/></svg>
      </button>
    </template>
  </div>

  <!-- ============ Dialogue « Add task » / « Edit task » ============ -->
  <div x-show="dialog.open" x-cloak class="fixed inset-0 z-[60]" role="presentation">
    <div x-show="dialog.open" x-transition.opacity.duration.100ms @click="dialog.open = false" class="fixed inset-0 bg-black/10 backdrop-blur-xs"></div>
    <div x-show="dialog.open" x-transition.opacity.duration.120ms role="dialog" aria-modal="true" aria-labelledby="tk-title"
         class="fixed top-1/2 left-1/2 grid max-h-[calc(100dvh-2rem)] w-full max-w-[calc(100%-2rem)] -translate-x-1/2 -translate-y-1/2 gap-4 overflow-y-auto rounded-xl bg-popover p-4 text-sm text-popover-foreground ring-1 ring-foreground/10 sm:max-w-lg">
      <form class="flex flex-col gap-4" @submit.prevent="submitTask()">
        <div class="flex flex-col gap-2">
          <h2 id="tk-title" class="text-base leading-none font-medium" x-text="dialog.mode === 'add' ? 'Add task' : 'Edit task'"></h2>
          <p class="text-sm text-muted-foreground" x-text="dialog.mode === 'add' ? 'Create a task and assign it to a team member.' : 'Update the details, status or assignee of this task.'"></p>
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div class="flex flex-col gap-1.5 sm:col-span-2">
            <label for="t-title" class="label-text">Task title</label>
            <input id="t-title" x-ref="ttitle" x-model="tform.title" class="input" placeholder="e.g. Cable sizing calculation" required>
          </div>
          <div x-show="dialog.mode === 'add'" class="flex flex-col gap-1.5 sm:col-span-2">
            <label for="t-project" class="label-text">Project</label>
            <select id="t-project" x-model="tform.projectId" @change="onProjectChange()" class="select">
              <template x-for="p in addableProjects" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
            </select>
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="t-status" class="label-text">Status</label>
            <select id="t-status" x-model="tform.status" class="select">
              <template x-for="s in STATUSES" :key="s"><option :value="s" x-text="s"></option></template>
            </select>
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="t-priority" class="label-text">Priority</label>
            <select id="t-priority" x-model="tform.priority" class="select"><option>High</option><option>Medium</option><option>Low</option></select>
          </div>
          <div class="flex flex-col gap-1.5 sm:col-span-2">
            <label for="t-assignee" class="label-text">Assignee</label>
            <select id="t-assignee" x-model="tform.assigneeId" class="select">
              <template x-for="m in formTeam" :key="m.id"><option :value="m.id" x-text="m.name + ' — ' + m.title"></option></template>
            </select>
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="t-start" class="label-text">Start date</label>
            <input id="t-start" type="date" x-model="tform.startDate" class="input">
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="t-due" class="label-text">Due date</label>
            <input id="t-due" type="date" x-model="tform.dueDate" :min="tform.startDate" class="input">
          </div>
        </div>
        <div class="-mx-4 -mb-4 flex flex-col-reverse gap-2 rounded-b-xl border-t bg-muted/50 p-4 sm:flex-row sm:justify-end">
          <button type="button" class="btn btn-outline" @click="dialog.open = false">Cancel</button>
          <button type="submit" class="btn btn-primary" :disabled="!validTask" x-text="dialog.mode === 'add' ? 'Add task' : 'Save changes'"></button>
        </div>
      </form>
    </div>
  </div>
