  <!-- ============ Dialogue « New amendment » ============ -->
  <div x-show="dialog.open" x-cloak class="fixed inset-0 z-[60]" role="presentation">
    <div x-show="dialog.open" x-transition.opacity.duration.100ms @click="dialog.open = false" class="fixed inset-0 bg-black/10 backdrop-blur-xs"></div>
    <div x-show="dialog.open" x-transition.opacity.duration.120ms role="dialog" aria-modal="true" aria-labelledby="am-title"
         class="fixed top-1/2 left-1/2 grid max-h-[calc(100dvh-2rem)] w-full max-w-[calc(100%-2rem)] -translate-x-1/2 -translate-y-1/2 gap-4 overflow-y-auto rounded-xl bg-popover p-4 text-sm text-popover-foreground ring-1 ring-foreground/10 sm:max-w-lg">
      <form class="flex flex-col gap-4" @submit.prevent="saveAmendment()">
        <div class="flex flex-col gap-2">
          <h2 id="am-title" class="text-base leading-none font-medium">New amendment (avenant)</h2>
          <p class="text-sm text-muted-foreground">Record a change to scope, schedule or budget. It will be saved as a draft.</p>
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div class="flex flex-col gap-1.5 sm:col-span-2">
            <label for="a-title" class="label-text">Title</label>
            <input id="a-title" x-ref="atitle" x-model="aform.title" class="input" placeholder="e.g. Additional inspection campaign" required>
          </div>
          <div x-show="!fixedProject" class="flex flex-col gap-1.5 sm:col-span-2">
            <label for="a-project" class="label-text">Project</label>
            <select id="a-project" x-model="aform.projectId" class="select">
              <template x-for="p in projects" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
            </select>
          </div>
          <div class="flex flex-col gap-1.5 sm:col-span-2">
            <label for="a-type" class="label-text">Revision type</label>
            <select id="a-type" x-model="aform.type" class="select">
              <template x-for="ty in TYPES" :key="ty"><option :value="ty" x-text="ty"></option></template>
            </select>
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="a-amount" class="label-text">Budget impact (EUR)</label>
            <input id="a-amount" type="number" inputmode="numeric" x-model="aform.amount" class="input" placeholder="0">
          </div>
          <div class="flex flex-col gap-1.5">
            <label for="a-days" class="label-text">Schedule impact (days)</label>
            <input id="a-days" type="number" inputmode="numeric" x-model="aform.days" class="input" placeholder="0">
          </div>
        </div>
        <div class="-mx-4 -mb-4 flex flex-col-reverse gap-2 rounded-b-xl border-t bg-muted/50 p-4 sm:flex-row sm:justify-end">
          <button type="button" class="btn btn-outline" @click="dialog.open = false">Cancel</button>
          <button type="submit" class="btn btn-primary" :disabled="!validAmendment">Save draft</button>
        </div>
      </form>
    </div>
  </div>
